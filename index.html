<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Argaw Soccer</title>
<style>
:root{--bg:#eaf3ec;--card:#fff;--tx:#10231a;--mut:#4d6a5a;--line:#c9dccf;--ac:#f5a300}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1912;--card:#16271d;--tx:#f1f6f2;--mut:#9fb8a8;--line:#27402f}}
:root[data-theme="dark"]{--bg:#0d1912;--card:#16271d;--tx:#f1f6f2;--mut:#9fb8a8;--line:#27402f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#setup{position:absolute;inset:0;overflow:auto;display:flex;padding:16px;align-items:flex-start;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;margin:auto}
h1,h2{margin:0;text-align:center}.lb{color:var(--mut);font-size:13px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
button,input{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px 14px}
.chip.on{background:var(--ac);color:#1a1200;border-color:var(--ac);font-weight:700}
.pri{background:var(--ac);color:#1a1200;border-color:var(--ac);font-weight:800;font-size:19px;padding:14px}
button:disabled{opacity:.5}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:17px}
#game{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:none;flex-direction:column;background:#0d1912;color:#f1f6f2}
#game.rot{width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#hud{display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:8px;background:#16271d;padding:4px 8px;height:42px;flex:none}
#qt{padding:4px 10px;font-size:15px;background:#0d1912;color:#f1f6f2;border-color:#27402f}
.pl{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0;font-size:14px}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.r{justify-content:flex-end}.pl.on{color:#ffd23f}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.d0{background:#2f7bff}.d1{background:#ef4444}
#sc{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
#tm{font-size:14px;background:#0d1912;padding:2px 10px;border-radius:99px;min-width:64px;text-align:center}
#wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#1d7a34}
canvas{display:block;touch-action:none}
#msg{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:2px 12px;border-radius:99px;font-size:12px;pointer-events:none;white-space:nowrap}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:8px}
#ov .card{max-width:340px;text-align:center;color:var(--tx)}
#hud{display:flex;align-items:center;justify-content:center;height:54px;padding:0 6px;background:linear-gradient(#454545,#1c1c1c);gap:0}
.side{flex:1;display:flex;align-items:center;gap:8px;min-width:0}.side.r{flex-direction:row-reverse}
.av{width:42px;height:42px;border:3px solid #e8a41c;background:#3d7fe0;position:relative;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.av svg{width:100%;height:100%;display:block}
.fl{position:absolute;left:-3px;bottom:-7px;width:20px;height:12px;border:1px solid #fff;background:linear-gradient(#078930 33%,#fcdd09 33% 66%,#da121a 66%)}
.strip{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;height:34px;padding:0 16px;background:linear-gradient(#f4f4f4,#b9b9b9);color:#4a4a4a;font-weight:800;font-size:15px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.side.r .strip{clip-path:polygon(14px 0,100% 0,100% 100%,0 100%)}
.strip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
.lv::after{content:'';border:6px solid transparent;border-top:9px solid #b8895a;border-bottom:0}
.side.on .strip{background:linear-gradient(#fff2b8,#e8c24a)}
#mid{display:flex;align-items:stretch;flex:none;height:100%}
.scb{width:58px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;background:linear-gradient(#2c2c2c,#101010)}
#tm{min-width:84px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#f7f7f7,#c9c9c9);color:#333;border-radius:0 0 12px 12px;font-weight:800;font-size:18px;padding:0 6px}
#qt{position:absolute;left:6px;bottom:6px;width:46px;height:46px;border-radius:8px;background:linear-gradient(#8be02f,#4aa010);border:2px solid #d6f1a8;color:#fff;font-size:24px;padding:0;z-index:2}
#msg:empty{display:none}
#tbar{height:5px;background:#111;flex:none}#tb{display:block;height:100%;width:100%;background:#7ed321}
</style></head><body>

<div id="setup"><div class="card">
 <h1>⚽ Argaw Soccer</h1>
 <div><div class="lb">YOUR NAME</div><input id="pname" maxlength="14" placeholder="Enter your name" autocomplete="off"></div>
 <div><div class="lb">GAME MODE</div><div class="row">
  <button class="chip on" data-k="mode" data-v="bot">🤖 vs Robot</button>
  <button class="chip" data-k="mode" data-v="two">👥 2 Players</button></div></div>
 <div><div class="lb">MATCH TIME</div><div class="row">
  <button class="chip on" data-k="min" data-v="5">5 min</button>
  <button class="chip" data-k="min" data-v="10">10 min</button></div></div>
 <div id="lvbox"><div class="lb">ROBOT LEVEL</div><div class="row"><button class="chip" data-k="lv" data-v="1">Medium</button><button class="chip on" data-k="lv" data-v="2">Pro</button><button class="chip" data-k="lv" data-v="3">Legend 🔥</button></div></div>
 <div id="p2box" style="display:none"><div class="lb">PLAYER 2 NAME</div><input id="p2" maxlength="14" value="Player 2" autocomplete="off"></div>
 <button class="pri" id="go">▶ START GAME</button>
 <div class="lb" id="rec" style="text-align:center"></div>
 <div class="lb" style="text-align:center;font-weight:400">The game opens in full-screen landscape. Touch a disc, drag back, release to shoot. Score into the opponent’s goal!</div>
 <button disabled>🌐 Online with friend (coming soon)</button>
</div></div>

<div id="game">
 <div id="hud">
  <div class="side" id="n0"><div class="av" id="av0"></div><div class="strip"><b id="nm0">—</b><span class="lv" id="lv0">LV 1</span></div></div>
  <div id="mid"><div class="scb"><b id="s0">0</b></div><div id="tm">0:00</div><div class="scb"><b id="s1">0</b></div></div>
  <div class="side r" id="n1"><div class="av" id="av1"></div><div class="strip"><span class="lv" id="lv1">LV 1</span><b id="nm1">—</b></div></div>
 </div>
 <div id="tbar"><i id="tb"></i></div><div id="wrap"><button id="qt">☰</button><canvas id="cv" width="1000" height="600"></canvas><div id="msg"></div><div id="ov"></div></div>
</div>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d'),ov=$('ov');
const W=1000,H=600,L=40,R=960,T=30,B=570,GY1=210,GY2=390,PR=6,GD=38,TURN=12,DR=30,BR=17,FR=.98,BFR=.985,MAXV=18,MAXPULL=150;
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,me=ld('argaw_name',''),cfg={mode:'bot',min:5,lv:2},drag=null,SIM=false,ac;
function beep(f,d,v=.08){if(SIM)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

const PHI=(1+Math.sqrt(5))/2,IV=[];for(const a of[-1,1])for(const b of[-PHI,PHI])for(const q of[[0,a,b],[a,b,0],[b,0,a]]){const m=Math.hypot(...q);IV.push(q.map(v=>v/m))}
const CROWD_SRC={goal:'',attempt:''};
function crowd(k){if(SIM)return;const src=k>.7?CROWD_SRC.goal:CROWD_SRC.attempt;
 if(src){try{const a=new Audio(src);a.volume=.9;a.play()}catch(e){}return}
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,dur=k>.7?6:3,pk=.3+.3*k,out=ac.createGain();
  out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(pk,t+.6);out.gain.setValueAtTime(pk,t+dur*.4);out.gain.exponentialRampToValueAtTime(.001,t+dur);out.connect(ac.destination);
  const fm=[[700,1],[1150,.7],[2600,.25]].map(([f,gv])=>{const b=ac.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=5;const gg=ac.createGain();gg.gain.value=gv;b.connect(gg);gg.connect(out);return b});
  for(let i=0;i<32;i++){const o=ac.createOscillator(),f0=(i%4?105:210)*(.85+Math.random()*.4);o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*(1.1+Math.random()*.25),t+dur*.5);
   const lf=ac.createOscillator(),lg=ac.createGain();lf.frequency.value=4+Math.random()*3;lg.gain.value=f0*.02;lf.connect(lg);lg.connect(o.frequency);
   const vg=ac.createGain();vg.gain.value=.02;o.connect(vg);fm.forEach(f=>vg.connect(f));const st=t+Math.random()*.4;o.start(st);lf.start(st);o.stop(t+dur);lf.stop(t+dur)}
  const n=ac.sampleRate*dur|0,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const ns=ac.createBufferSource();ns.buffer=buf;const bf=ac.createBiquadFilter();bf.type='bandpass';bf.frequency.value=1400;bf.Q.value=.5;const ng=ac.createGain();ng.gain.value=.35;ns.connect(bf);bf.connect(ng);ng.connect(out);ns.start(t)}catch(e){}}
const HIT_SRC={dd:'',db:'',w:'',p:''},HS={dd:0,db:0,w:0,p:0};
function hit(t,v){if(SIM)return;const n=performance.now();if(n-HS[t]<35)return;HS[t]=n;
 if(HIT_SRC[t]){try{const a=new Audio(HIT_SRC[t]);a.volume=Math.min(1,v/14+.2);a.play()}catch(e){}return}
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const T0=ac.currentTime,g=ac.createGain();g.gain.setValueAtTime(Math.min(1,v/14)*.8+.12,T0);g.connect(ac.destination);
  const nz=(dur,fq,q,ty)=>{const m=ac.sampleRate*dur|0,b=ac.createBuffer(1,m,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<m;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/m,3);const sr=ac.createBufferSource();sr.buffer=b;const f=ac.createBiquadFilter();f.type=ty;f.frequency.value=fq;f.Q.value=q;sr.connect(f);f.connect(g);sr.start(T0)};
  const tn=(fq,dur,vv)=>{const o=ac.createOscillator(),og=ac.createGain();o.frequency.setValueAtTime(fq,T0);o.frequency.exponentialRampToValueAtTime(fq*.6,T0+dur);og.gain.setValueAtTime(vv,T0);og.gain.exponentialRampToValueAtTime(.001,T0+dur);o.connect(og);og.connect(g);o.start(T0);o.stop(T0+dur)};
  if(t=='dd'){nz(.05,3200,2,'bandpass');tn(1800,.09,.5);tn(2700,.05,.25)}
  else if(t=='db'){nz(.06,1400,1,'bandpass');tn(260,.13,.8)}
  else if(t=='w'){nz(.08,500,1,'lowpass');tn(140,.1,.5)}
  else{tn(2200,.35,.5);tn(3300,.2,.2);nz(.02,4000,1,'highpass')}}catch(e){}}
/* ---------- physics ---------- */
const mk=(x,y,r,m,t)=>({x,y,vx:0,vy:0,r,m,t});
const FORM=[[87,300],[293,300],[400,300],[193,150],[193,450]];
function place(){S.b=[];for(let t=0;t<2;t++)FORM.forEach(p=>S.b.push(mk(t?W-p[0]:p[0],p[1],DR,3,t)));S.b.push(mk(500,300,BR,1,2));S.bv=IV.map(q=>q.slice())}
function col(a,c){const dx=c.x-a.x,dy=c.y-a.y,mn=a.r+c.r,d2=dx*dx+dy*dy;if(d2>=mn*mn||d2===0)return;
 const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=mn-d,im=1/a.m+1/c.m;
 a.x-=nx*ov/a.m/im;a.y-=ny*ov/a.m/im;c.x+=nx*ov/c.m/im;c.y+=ny*ov/c.m/im;
 const rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;
 if(rv<0){const j=-1.92*rv/im;a.vx-=j*nx/a.m;a.vy-=j*ny/a.m;c.vx+=j*nx/c.m;c.vy+=j*ny/c.m;if(-rv>1.5)hit(a.t==2||c.t==2?'db':'dd',-rv)}}
function walls(o){const r=o.r,gap=o.t==2&&o.y>GY1+PR&&o.y<GY2-PR;let hv=0;
 if(o.y<T+r){o.y=T+r;hv=Math.abs(o.vy);o.vy=Math.abs(o.vy)*.9}if(o.y>B-r){o.y=B-r;hv=Math.abs(o.vy);o.vy=-Math.abs(o.vy)*.9}
 if(!gap){if(o.x<L+r){o.x=L+r;hv=Math.max(hv,Math.abs(o.vx));o.vx=Math.abs(o.vx)*.9}if(o.x>R-r){o.x=R-r;hv=Math.max(hv,Math.abs(o.vx));o.vx=-Math.abs(o.vx)*.9}}
 if(hv>2.5)hit('w',hv);
 if(Math.abs(o.x-L)<r+PR+1||Math.abs(o.x-R)<r+PR+1)for(const px of[L,R])for(const py of[GY1,GY2]){const dx=o.x-px,dy=o.y-py,d=Math.hypot(dx,dy),mn=r+PR;
  if(d<mn&&d>0){const nx=dx/d,ny=dy/d;o.x=px+nx*mn;o.y=py+ny*mn;const v=o.vx*nx+o.vy*ny;if(v<0){o.vx-=1.9*v*nx;o.vy-=1.9*v*ny;if(-v>2)hit('p',-v)}}}}
function step(b){
 for(let k=0;k<4;k++){for(const o of b){o.x+=o.vx/4;o.y+=o.vy/4}
  for(let i=0;i<b.length;i++)for(let j=i+1;j<b.length;j++)col(b[i],b[j]);
  for(const o of b)walls(o)}
 for(const o of b){const f=o.t==2?BFR:FR;o.vx*=f;o.vy*=f;if(Math.abs(o.vx)+Math.abs(o.vy)<.05)o.vx=o.vy=0}
 const x=b[10].x;return x>R+4?1:x<L-4?2:0}
const still=b=>b.every(o=>!o.vx&&!o.vy);

/* ---------- game flow ---------- */
const PERSON='<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#cfe3ff"/><circle cx="20" cy="15" r="7" fill="#3b82f6"/><path d="M6 38c1-10 8-14 14-14s13 4 14 14z" fill="#3b82f6"/></svg>',FLAG='<i class="fl"></i>';
function start(){hide();const bot=cfg.mode=='bot',nm=[me,bot?'AI':(cfg.p2||'Player 2')],pv=ld('argaw_lvpvp',{}),
 lvl=bot?[ld('argaw_lvbot',1),[4,10,20][cfg.lv-1]]:[pv[nm[0].toLowerCase()]||1,pv[nm[1].toLowerCase()]||1];
 $('av0').innerHTML=PERSON+FLAG;$('av1').innerHTML=bot?'🤖':PERSON+FLAG;$('av1').style.background=bot?'#1f9d55':'#3d7fe0';
 S={mode:cfg.mode,lv:cfg.lv,nm,lvl,sc:[0,0],time:cfg.min*60,turn:0,phase:'aim',sd:false,timeUp:false,tt:TURN,b:[]};place();hud()}
function hud(){if(!S)return;$('nm0').textContent=S.nm[0];$('nm1').textContent=S.nm[1];$('lv0').textContent='LV '+S.lvl[0];$('lv1').textContent='LV '+S.lvl[1];$('s0').textContent=S.sc[0];$('s1').textContent=S.sc[1];
 $('n0').classList.toggle('on',S.turn==0&&S.phase=='aim');$('n1').classList.toggle('on',S.turn==1&&S.phase=='aim');
 const bot=S.mode=='bot'&&S.turn==1;
 $('msg').textContent=S.phase=='goal'?'⚽ GOAL!':S.phase=='over'?'Full time':(S.phase=='move'||bot)?'':(S.mode=='bot'?'Your turn — drag back & release':S.nm[S.turn]+'’s turn — drag back & release')}
function shoot(o,a,pw){o.vx=Math.cos(a)*pw*MAXV;o.vy=Math.sin(a)*pw*MAXV;S.phase='move';S.att=0;hud()}
function endMove(){S.turn=1-S.turn;S.phase='aim';S.tt=TURN;if(!checkEnd()){hud();botTurn()}}
function checkEnd(){if(S.timeUp){if(S.sc[0]!=S.sc[1]){finish();return true}if(!S.sd){S.sd=true;$('msg').textContent='⚡ Golden goal! Next goal wins'}}return false}
function goal(r){const sc=r==1?0:1;S.sc[sc]++;S.phase='goal';S.gs=r;S.netT=performance.now();hud();beep(660,.5,.12);crowd(1);const g=S;
 setTimeout(()=>{if(S!==g)return;if(S.sd||(S.timeUp&&S.sc[0]!=S.sc[1])){finish();return}
  place();S.turn=1-sc;S.phase='aim';S.tt=TURN;if(S.timeUp)S.sd=true;hud();botTurn()},1600)}
function finish(){S.phase='over';const [a,b]=S.sc,w=a>b?0:1;let t,up='';
 if(S.mode=='bot'){const rc=ld('argaw_rec',{w:0,l:0});if(w==0){rc.w++;const n=ld('argaw_lvbot',1)+1;sv('argaw_lvbot',n);S.lvl[0]=n;up='⬆ LEVEL UP! LV '+n}else rc.l++;sv('argaw_rec',rc);t=w==0?'🏆 You win!':'AI wins — try again'}
 else{const m=ld('argaw_lvpvp',{}),k=S.nm[w].toLowerCase();m[k]=(m[k]||1)+1;sv('argaw_lvpvp',m);S.lvl[w]=m[k];up='⬆ '+esc(S.nm[w])+' LEVEL UP! LV '+m[k];t='🏆 '+esc(S.nm[w])+' wins!'}
 hud();show(`<h2>${t}</h2><div style="font-size:34px;font-weight:800">${a} : ${b}</div><div class="lb">${esc(S.nm[0])} vs ${esc(S.nm[1])}</div><div style="color:var(--ac);font-weight:800">${up}</div>
 <button class="pri" id="again">Play Again</button><button id="tomenu">Menu</button>`);
 $('again').onclick=start;$('tomenu').onclick=leave}

/* ---------- robot ---------- */
function botTurn(){if(S.mode=='bot'&&S.turn==1&&S.phase=='aim'){const g=S;setTimeout(()=>{if(S===g&&S.phase=='aim'&&S.turn==1)bot()},300)}}
function evalPos(c,res){if(res==1)return-1e4;if(res==2)return 1e4;const ba=c[10];
 let dm=1e9,db=1e9,nb=null;for(let i=0;i<5;i++)dm=Math.min(dm,Math.hypot(c[i].x-ba.x,c[i].y-ba.y));
 for(let i=5;i<10;i++){const d=Math.hypot(c[i].x-ba.x,c[i].y-ba.y);if(d<db){db=d;nb=c[i]}}
 let sc=-Math.hypot(ba.x-L,ba.y-300)-Math.max(0,ba.x-480)*.7+(dm-db)*.15;
 if(nb){const gx=L-ba.x,gy=300-ba.y,gl=Math.hypot(gx,gy)||1,bx=ba.x-nb.x,by=ba.y-nb.y,bl=Math.hypot(bx,by)||1;sc+=((gx*bx+gy*by)/(gl*bl))*45}
 if(ba.x>780&&Math.abs(ba.y-300)<170)sc-=140;return sc}
function reply(c){let w=1e9;const ba=c[10];
 for(let i=0;i<5;i++){const d=c[i],as=[];for(let k=0;k<24;k++)as.push(k/24*6.2832);
  as.push(Math.atan2(ba.y-d.y,ba.x-d.x));{let ux=R+10-ba.x,uy=300-ba.y;const ul=Math.hypot(ux,uy);ux/=ul;uy/=ul;as.push(Math.atan2(ba.y-uy*(d.r+ba.r)-d.y,ba.x-ux*(d.r+ba.r)-d.x))}
  for(const a of as){const cc=c.map(o=>({...o}));cc[i].vx=Math.cos(a)*MAXV;cc[i].vy=Math.sin(a)*MAXV;let res=0;for(let f=0;f<90;f++){res=step(cc);if(res||(f>4&&still(cc)))break}w=Math.min(w,evalPos(cc,res))}}return w}
function bot(){const cf=[{na:24,pws:[1,.6],n:.14,j:60,fr:110,bud:800},{na:48,pws:[1,.55],n:.035,j:4,fr:130,bud:1100},{na:60,pws:[1,.75,.5],n:.004,j:.3,fr:150,bud:1300}][S.lv-1];
 const g=S,T0=performance.now(),base=S.b.map(o=>({...o})),C=[],bl=base[10],
